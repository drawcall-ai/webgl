name: Publish packages
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-webgpu
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
      - name: Prepare all release tarballs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for directory in dist/package-*; do
            mv "$directory" "dist/${directory#dist/package-}"
          done
          npm run release:prepare -- "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Publish native packages, then main package
        run: npm run release:publish

  registry-install:
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            image: node:22-bookworm-slim
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            image: node:22-bookworm-slim
          - target: linuxmusl-x64
            runner: ubuntu-24.04
            image: node:22-alpine
          - target: linuxmusl-arm64
            runner: ubuntu-24.04-arm
            image: node:22-alpine
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: runner.os != 'Linux'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install Linux release with automatic native package selection
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            npm run test:package -- --version "${RELEASE_TAG#v}" --repetitions 1
      - name: Install desktop release with automatic native package selection
        if: runner.os != 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run test:package -- --version "${RELEASE_TAG#v}" --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-${{ matrix.target }}
          path: test/out
