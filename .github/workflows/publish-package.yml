name: Publish packages
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable release tag such as v0.1.0' >&2
            exit 1
          fi
          npm pkg set version="$version"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mv "dist/package-$target" "dist/$target"
            npm pkg set "optionalDependencies.@drawcall/webgpu-$target=$version"
            npm --prefix "dist/$target" pkg set version="$version"
          done
      - name: Publish native packages
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./dist/$target" --access public --provenance
          done
      - run: npm publish --access public --provenance

  registry-install:
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            container: node:24-bookworm-slim
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: node:24-bookworm-slim
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install release with automatic native package selection
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run test:package -- --version "${RELEASE_TAG#v}" --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-${{ matrix.target }}
          path: test/out
