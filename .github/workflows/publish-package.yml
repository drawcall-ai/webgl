name: Publish packages
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-webgpu
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
      - name: Prepare all release tarballs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for directory in dist/package-*; do
            mv "$directory" "dist/${directory#dist/package-}"
          done
          npm run release:prepare -- "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Publish native packages, then main package
        run: npm run release:publish

  registry-install:
    needs: publish
    uses: ./.github/workflows/verify-package.yml
    with:
      version: ${{ github.ref_name }}
