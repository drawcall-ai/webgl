name: diagnose-windows
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: package-win32-x64
          path: dist/win32-x64
          run-id: 39506778134
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:package -- dist/win32-x64 --repetitions 1
