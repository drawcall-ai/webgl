name: ci
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            container: node:24-bookworm
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: node:24-bookworm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y cmake build-essential curl git pkg-config libvulkan1 libdrm2 zlib1g libzstd1 libudev1 python3 python3-pip python3-venv patchelf
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install ninja==1.13.0
          echo /opt/tools/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Desktop build tools
        if: runner.os != 'Linux'
        run: python -m pip install ninja==1.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/cache@v4
        with:
          path: build
          key: dawn-${{ matrix.target }}-${{ hashFiles('native/**', 'deps/**') }}
          restore-keys: dawn-${{ matrix.target }}-
      - name: Build native package
        run: python native/build.py build dist/${{ matrix.target }}
      - name: Bundle Linux runtime
        if: runner.os == 'Linux'
        run: |
          python deps/mesa.py dist/${{ matrix.target }}
          python deps/bundle.py dist/${{ matrix.target }}
          bash deps/check.sh dist/${{ matrix.target }}
      - name: Package
        run: node deps/package.js dist/${{ matrix.target }}
      - name: Test installed packages
        run: python deps/consumer.py dist/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: test/out
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/${{ matrix.target }}

  clean-linux:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: [node:24-bookworm-slim, node:24-trixie-slim]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Target
        run: echo "TARGET=linux-$(node -p process.arch)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ env.TARGET }}
          path: dist/${{ env.TARGET }}
      - name: Install test harness
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Render without system graphics packages
        run: python3 deps/consumer.py dist/${{ env.TARGET }} --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-${{ env.TARGET }}-${{ strategy.job-index }}
          path: test/out
